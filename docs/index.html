<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Whisker Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-header">

        <div class="logo-container">
            <img
                src="images/Whisker_Logo.png"
                alt="Whisker Simulator"
                class="logo"
            >
        </div>

        <nav class="model-nav" aria-label="Simulator models">
            <a href="?page=lr4" data-page="lr4">LR4</a>
            <a href="?page=lre" data-page="lre">LRE</a>
            <a href="?page=lr5-pro" data-page="lr5-pro">LR5/LR5 Pro</a>
        </nav>

    </header>

    <main class="box-grid" aria-label="Whisker options">
        <h1 class="simulation-heading">Choose a Simulation</h1>

        <div class="boxes">
                <a class="soft-box lr4-red simulation-link lr4-card" href="lr4-red.html">
                    <span class="box-label">LR4 · Solid Red Light</span>
                </a>
                <div class="soft-box other-model-card" hidden><span class="coming-soon">Coming Soon</span></div>
            <div class="soft-box"><span class="coming-soon">Coming Soon</span></div>
            <div class="soft-box"><span class="coming-soon">Coming Soon</span></div>
            <div class="soft-box"><span class="coming-soon">Coming Soon</span></div>
                <a class="soft-box lr4-flash-blue simulation-link lr4-card" href="lr4-flash-blue.html">
                    <span class="box-label">LR4 · Flashing Blue Light</span>
                </a>
                <div class="soft-box other-model-card" hidden><span class="coming-soon">Coming Soon</span></div>
            <div class="soft-box"><span class="coming-soon">Coming Soon</span></div>
            <div class="soft-box"><span class="coming-soon">Coming Soon</span></div>
            <div class="soft-box"><span class="coming-soon">Coming Soon</span></div>
        </div>
    </main>

    <script src="script.js"></script>

</body>

</html>
